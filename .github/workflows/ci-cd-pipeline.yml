# This name will appear in the "Actions" tab of your GitHub repository.
name: Library Management API CI/CD - Security Scan, Build, and Push Docker Image

# Controls when the workflow will run.
on:
  # Triggers the workflow on push & pull request events but only for the "main", "library_management_jwt_auth" or "master" branch.
  push:
    branches: [ "main", "master", "library_management_jwt_auth" ]
  pull_request:
    branches: [ "main", "master", "library_management_jwt_auth" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: RUN ALL QUALITY AND SECURITY CHECKS ---
  quality-and-security-gate:
    name: Quality and Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.1'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Code with ESLint
        run: npm run lint

      # --- Temporarily Disabled ---
      # This step will be enabled once the Jest test suite is implemented.
      # - name: Run Jest Tests
      #   run: npm test

      # CodeQL static analysis will be enabled along with the test suite.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Scan for Dependency Vulnerabilities with npm audit
        run: npm audit --audit-level=high

  # --- JOB 2: BUILD AND PUSH DOCKER IMAGE ---
  # This job will only run if the 'quality-and-security-gate' job completes successfully.
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    # Define dependency on the previous job
    needs: quality-and-security-gate
    # This section only runs for pushes to the main/master branch, not for pull requests.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/build-push-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # We removed the Trivy scan from here in the last step to simplify,
      # but you could add it back if desired for an extra layer of security.
      - name: Build and Push Verified Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-api:latest, ${{ secrets.DOCKERHUB_USERNAME }}/library-api:${{ github.sha }}